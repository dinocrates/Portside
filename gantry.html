<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overhead Gantry — Portside Motion Lab</title>
  </head>
  <body>
    <div id="gantry-page">
      <header id="gantry-top-bar">
        <h1 id="gantry-title"></h1>
        <div id="gantry-mode-selector"></div>
        <div class="run-buttons" role="group" aria-label="Run controls">
          <button type="button" data-action="start">Start</button>
          <button type="button" data-action="pause-resume">Pause</button>
          <button type="button" data-action="reset">Reset</button>
        </div>
        <a id="gantry-link" href="index.html">← Ship-to-Shore Trolley (1D)</a>
      </header>
      <p id="gantry-brief"></p>

      <div id="gantry-layout">
        <div id="gantry-scene-column">
          <div id="gantry-scene-container"></div>
          <div id="gantry-live-strip"></div>
        </div>
        <div id="gantry-side-panel">
          <div id="gantry-manual-controls"></div>
          <div id="gantry-profile-editor" hidden></div>
          <div id="gantry-results" hidden aria-live="polite"></div>
        </div>
      </div>

      <section id="gantry-analysis-view" hidden aria-label="Run analysis: graphs, replay, and export"></section>
    </div>
    <script type="module" src="/src/gantry2d/main.ts"></script>
  </body>
</html>
