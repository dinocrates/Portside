<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portside Motion Lab</title>
  </head>
  <body>
    <div id="root">
      <header id="top-bar">
        <h1 id="scenario-title"></h1>
        <div id="run-controls"></div>
      </header>

      <div id="layout">
        <div id="scene-column">
          <div id="scene-container"></div>
          <div id="live-strip" aria-hidden="true"></div>
          <div id="feedback-message" aria-live="polite"></div>
        </div>

        <div id="side-panel">
          <div id="manual-controls-panel"></div>
          <div id="profile-editor-panel"></div>
          <div id="results-panel" hidden aria-live="polite"></div>
        </div>
      </div>

      <section id="analysis-view" hidden aria-label="Run analysis: graphs, replay, and export"></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
